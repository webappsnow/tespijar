<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC & Listrik - Dashboard</title>

<!-- Google Fonts: Inter + Plus Jakarta Sans -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  /* ============ ROOT VARIABLES (LIGHT) ============ */
  :root {
    --bg: #f8fafc;
    --bg-card: #ffffff;
    --bg-hover: #f1f5f9;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --info: #3b82f6;
    --shadow: 0 1px 3px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.08);
    --radius: 14px;
  }

  /* ============ DARK MODE ============ */
  [data-theme="dark"] {
    --bg: #0f172a;
    --bg-card: #1e293b;
    --bg-hover: #334155;
    --text: #f1f5f9;
    --text-muted: #94a3b8;
    --border: #334155;
    --shadow: 0 1px 3px rgba(0,0,0,.3);
    --shadow-lg: 0 10px 25px rgba(0,0,0,.4);
  }

  /* ============ RESET & BASE ============ */
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    transition: background .3s, color .3s;
    min-height: 100vh;
    line-height: 1.5;
  }

  h1, h2, h3 {
    font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
    letter-spacing: -0.02em;
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 20px 60px;
  }

  /* ============ HEADER ============ */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-weight: 800;
    font-size: 20px;
    letter-spacing: -0.03em;
  }

  .logo-badge {
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, var(--primary), #8b5cf6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 12px rgba(99,102,241,.3);
  }

  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* ============ BUTTONS ============ */
  .btn {
    padding: 10px 18px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    transition: all .15s;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }

  .btn:active { transform: scale(.97); }

  .btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.3);
  }
  .btn-primary:hover { background: var(--primary-hover); }

  .btn-success { background: var(--success); color: #fff; }
  .btn-success:hover { filter: brightness(1.1); }

  .btn-danger { background: var(--danger); color: #fff; }
  .btn-danger:hover { filter: brightness(1.1); }

  .btn-ghost {
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text); }

  .btn-icon {
    width: 40px;
    height: 40px;
    padding: 0;
    justify-content: center;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
  }
  .btn-icon:hover { background: var(--bg-hover); }

  /* ============ STATS CARDS ============ */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat {
    padding: 22px;
    border-radius: var(--radius);
    background: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
    transition: transform .2s, box-shadow .2s;
  }

  .stat:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }

  .stat::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
  }

  .stat.green::before { background: var(--success); }
  .stat.red::before { background: var(--danger); }
  .stat.blue::before { background: var(--info); }
  .stat.orange::before { background: var(--warning); }

  .stat-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }

  .stat-label {
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .stat-icon {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .stat.green .stat-icon { background: rgba(16,185,129,.15); }
  .stat.red .stat-icon { background: rgba(239,68,68,.15); }
  .stat.blue .stat-icon { background: rgba(59,130,246,.15); }
  .stat.orange .stat-icon { background: rgba(245,158,11,.15); }

  .stat-value {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
  }

  /* ============ TABS ============ */
  .tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    padding: 4px;
    background: var(--bg-card);
    border-radius: 12px;
    border: 1px solid var(--border);
    width: fit-content;
    max-width: 100%;
    overflow-x: auto;
  }

  .tab {
    padding: 9px 18px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-muted);
    transition: all .15s;
    white-space: nowrap;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
  }

  .tab:hover { color: var(--text); background: var(--bg-hover); }

  .tab.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 12px rgba(99,102,241,.3);
  }

  /* ============ CARD ============ */
  .card {
    background: var(--bg-card);
    border-radius: var(--radius);
    padding: 24px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    margin-bottom: 20px;
    transition: background .3s, border-color .3s;
  }

  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .card h2 {
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.02em;
  }

  /* ============ TABLE ============ */
  .table-wrapper { overflow-x: auto; margin: 0 -8px; padding: 0 8px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    min-width: 600px;
  }

  th, td {
    padding: 12px 10px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  th {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    background: transparent;
  }

  tbody tr {
    transition: background .15s;
  }

  tbody tr:hover {
    background: var(--bg-hover);
  }

  tbody tr:last-child td { border-bottom: none; }

  .money-in { color: var(--success); font-weight: 600; }
  .money-out { color: var(--danger); font-weight: 600; }

  /* ============ BADGE ============ */
  .badge {
    padding: 4px 10px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: 600;
    display: inline-block;
    letter-spacing: 0.02em;
  }

  .badge-blue { background: rgba(59,130,246,.15); color: #2563eb; }
  .badge-orange { background: rgba(245,158,11,.15); color: #d97706; }
  .badge-green { background: rgba(16,185,129,.15); color: #059669; }
  .badge-red { background: rgba(239,68,68,.15); color: #dc2626; }

  [data-theme="dark"] .badge-blue { color: #93c5fd; }
  [data-theme="dark"] .badge-orange { color: #fbbf24; }
  [data-theme="dark"] .badge-green { color: #6ee7b7; }
  [data-theme="dark"] .badge-red { color: #fca5a5; }

  /* ============ FORM ============ */
  label {
    display: block;
    font-size: 13px;
    margin-bottom: 6px;
    color: var(--text);
    font-weight: 500;
  }

  input, select, textarea {
    width: 100%;
    padding: 11px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'Inter', sans-serif;
    margin-bottom: 14px;
    background: var(--bg-card);
    color: var(--text);
    transition: all .15s;
  }

  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99,102,241,.15);
  }

  /* ============ MODAL ============ */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(15,23,42,.6);
    backdrop-filter: blur(4px);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    animation: fadeIn .2s;
  }

  .modal.show { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px) scale(.98); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal-content {
    background: var(--bg-card);
    padding: 28px;
    border-radius: 16px;
    max-width: 520px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: var(--shadow-lg);
    animation: slideUp .25s ease-out;
  }

  .modal-content h2 {
    font-size: 19px;
    margin-bottom: 20px;
    letter-spacing: -0.02em;
  }

  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }

  /* ============ MISC ============ */
  .hidden { display: none !important; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .empty {
    text-align: center;
    padding: 48px 20px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .empty-icon {
    font-size: 42px;
    margin-bottom: 12px;
    opacity: .5;
  }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 14px 20px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
    font-size: 14px;
    font-weight: 500;
    z-index: 200;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: slideUp .25s;
  }

  .toast.success { border-left: 4px solid var(--success); }
  .toast.error { border-left: 4px solid var(--danger); }

  /* ============ SCROLLBAR ============ */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 640px) {
    .container { padding: 16px 14px 40px; }
    .logo { font-size: 17px; }
    .logo-badge { width: 34px; height: 34px; font-size: 18px; }
    .stat-value { font-size: 19px; }
    .grid2 { grid-template-columns: 1fr; }
    .modal-content { padding: 22px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- HEADER -->
  <div class="header">
    <div class="logo">
      <div class="logo-badge">⚡</div>
      AC & Listrik
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="toggleTheme()" title="Ganti Tema" id="themeBtn">🌙</button>
      <button class="btn btn-primary" onclick="openTambah()">+ Pekerjaan</button>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat green">
      <div class="stat-header">
        <div class="stat-label">Pemasukan</div>
        <div class="stat-icon">💰</div>
      </div>
      <div class="stat-value" id="statMasuk">Rp 0</div>
    </div>
    <div class="stat red">
      <div class="stat-header">
        <div class="stat-label">Pengeluaran</div>
        <div class="stat-icon">💸</div>
      </div>
      <div class="stat-value" id="statKeluar">Rp 0</div>
    </div>
    <div class="stat blue">
      <div class="stat-header">
        <div class="stat-label">Laba Bersih</div>
        <div class="stat-icon">📈</div>
      </div>
      <div class="stat-value" id="statLaba">Rp 0</div>
    </div>
    <div class="stat orange">
      <div class="stat-header">
        <div class="stat-label">Pekerjaan Aktif</div>
        <div class="stat-icon">🔧</div>
      </div>
      <div class="stat-value" id="statAktif">0</div>
    </div>
  </div>

  <!-- TABS -->
  <div class="tabs">
    <button class="tab active" onclick="switchTab('pekerjaan', this)">🔧 Pekerjaan</button>
    <button class="tab" onclick="switchTab('pemasukan', this)">💰 Pemasukan</button>
    <button class="tab" onclick="switchTab('pengeluaran', this)">💸 Pengeluaran</button>
  </div>

  <!-- TAB: PEKERJAAN -->
  <div class="card" id="tab-pekerjaan">
    <div class="card-header">
      <h2>Daftar Pekerjaan</h2>
    </div>
    <div class="table-wrapper" id="listPekerjaan">
      <div class="empty">
        <div class="empty-icon">⏳</div>
        Memuat data...
      </div>
    </div>
  </div>

  <!-- TAB: PEMASUKAN -->
  <div class="card hidden" id="tab-pemasukan">
    <div class="card-header">
      <h2>Daftar Pemasukan</h2>
      <button class="btn btn-success" onclick="openTambahMasuk()">+ Tambah</button>
    </div>
    <div class="table-wrapper" id="listPemasukan">
      <div class="empty">
        <div class="empty-icon">⏳</div>
        Memuat data...
      </div>
    </div>
  </div>

  <!-- TAB: PENGELUARAN -->
  <div class="card hidden" id="tab-pengeluaran">
    <div class="card-header">
      <h2>Daftar Pengeluaran</h2>
      <button class="btn btn-danger" onclick="openTambahKeluar()">+ Tambah</button>
    </div>
    <div class="table-wrapper" id="listPengeluaran">
      <div class="empty">
        <div class="empty-icon">⏳</div>
        Memuat data...
      </div>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH PEKERJAAN -->
<div class="modal" id="modalPekerjaan">
  <div class="modal-content">
    <h2>➕ Tambah Pekerjaan</h2>
    <label>Nama Customer</label>
    <input id="pNama" placeholder="Nama lengkap">

    <label>Tipe Customer</label>
    <select id="pTipe">
      <option value="perorangan">👤 Perorangan</option>
      <option value="instansi">🏢 Instansi</option>
    </select>

    <label>No HP</label>
    <input id="pHp" placeholder="08xx">

    <label>Jenis Pekerjaan</label>
    <select id="pJenis">
      <option>Instalasi AC</option>
      <option>Service AC</option>
      <option>Instalasi Listrik</option>
      <option>Perbaikan Listrik</option>
    </select>

    <label>Total Harga (Rp)</label>
    <input id="pTotal" type="number" placeholder="0">

    <div class="grid2">
      <div>
        <label>Jumlah Termin</label>
        <select id="pTermin">
          <option value="2">2 x (50%-50%)</option>
          <option value="3">3 x (30%-40%-30%)</option>
        </select>
      </div>
      <div>
        <label>Tanggal Mulai</label>
        <input id="pTgl" type="date">
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-success" onclick="simpanPekerjaan()">💾 Simpan</button>
      <button class="btn btn-ghost" onclick="closeModal('modalPekerjaan')">Batal</button>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH PEMASUKAN -->
<div class="modal" id="modalMasuk">
  <div class="modal-content">
    <h2>💰 Tambah Pemasukan</h2>
    <label>Pekerjaan</label>
    <select id="mPekerjaan"><option value="">-- Pilih --</option></select>

    <label>Tanggal</label>
    <input id="mTanggal" type="date">

    <label>Nominal (Rp)</label>
    <input id="mNominal" type="number" placeholder="0">

    <label>Metode</label>
    <select id="mMetode">
      <option value="cash">Cash</option>
      <option value="transfer">Transfer</option>
    </select>

    <label>Keterangan</label>
    <input id="mKet" placeholder="Contoh: DP Termin 1">

    <div class="modal-actions">
      <button class="btn btn-success" onclick="simpanMasuk()">💾 Simpan</button>
      <button class="btn btn-ghost" onclick="closeModal('modalMasuk')">Batal</button>
    </div>
  </div>
</div>

<!-- MODAL TAMBAH PENGELUARAN -->
<div class="modal" id="modalKeluar">
  <div class="modal-content">
    <h2>💸 Tambah Pengeluaran</h2>
    <label>Kategori</label>
    <select id="kKategori">
      <option value="material">Material</option>
      <option value="gaji">Gaji Teknisi</option>
      <option value="transport">Transport</option>
      <option value="operasional">Operasional</option>
    </select>

    <label>Tanggal</label>
    <input id="kTanggal" type="date">

    <label>Nominal (Rp)</label>
    <input id="kNominal" type="number" placeholder="0">

    <label>Keterangan</label>
    <input id="kKet" placeholder="Contoh: Beli pipa AC">

    <div class="modal-actions">
      <button class="btn btn-danger" onclick="simpanKeluar()">💾 Simpan</button>
      <button class="btn btn-ghost" onclick="closeModal('modalKeluar')">Batal</button>
    </div>
  </div>
</div>

<!-- FIREBASE SDK -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs, deleteDoc, doc,
  serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

// ====================== CONFIG FIREBASE ======================
const firebaseConfig = {
  apiKey: "GANTI_DENGAN_API_KEY",
  authDomain: "GANTI.firebaseapp.com",
  projectId: "GANTI_PROJECT_ID",
  storageBucket: "GANTI.appspot.com",
  messagingSenderId: "GANTI_SENDER_ID",
  appId: "GANTI_APP_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ====================== HELPERS ======================
const rupiah = (n) => "Rp " + Number(n || 0).toLocaleString("id-ID");

function toast(msg, type = "success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.innerHTML = `<span>${type === "success" ? "✅" : "❌"}</span> ${msg}`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

// ====================== THEME TOGGLE ======================
window.toggleTheme = () => {
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  localStorage.setItem("theme", next);
  document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
};

// Init theme
(function initTheme() {
  const saved = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", saved);
  setTimeout(() => {
    document.getElementById("themeBtn").textContent = saved === "dark" ? "☀️" : "🌙";
  }, 50);
})();

// ====================== STATE ======================
let dataPekerjaan = [];
let dataPemasukan = [];
let dataPengeluaran = [];

// ====================== LOAD DATA ======================
async function loadAll() {
  try {
    const pj = await getDocs(collection(db, "pekerjaan"));
    dataPekerjaan = pj.docs.map(d => ({ id: d.id, ...d.data() }));

    const pm = await getDocs(collection(db, "pemasukan"));
    dataPemasukan = pm.docs.map(d => ({ id: d.id, ...d.data() }));

    const pk = await getDocs(collection(db, "pengeluaran"));
    dataPengeluaran = pk.docs.map(d => ({ id: d.id, ...d.data() }));

    hitungStats();
    renderPekerjaan();
    renderPemasukan();
    renderPengeluaran();
    isiDropdownPekerjaan();
  } catch (err) {
    console.error(err);
    toast("Gagal load data: " + err.message, "error");
  }
}

function hitungStats() {
  const masuk = dataPemasukan.reduce((s, x) => s + Number(x.nominal || 0), 0);
  const keluar = dataPengeluaran.reduce((s, x) => s + Number(x.nominal || 0), 0);
  const aktif = dataPekerjaan.filter(p => p.status !== "lunas").length;

  document.getElementById("statMasuk").textContent = rupiah(masuk);
  document.getElementById("statKeluar").textContent = rupiah(keluar);
  document.getElementById("statLaba").textContent = rupiah(masuk - keluar);
  document.getElementById("statAktif").textContent = aktif;
}

// ====================== RENDER ======================
function renderPekerjaan() {
  const el = document.getElementById("listPekerjaan");
  if (dataPekerjaan.length === 0) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">📋</div>
      Belum ada pekerjaan.<br>Klik "+ Pekerjaan" untuk tambah.
    </div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>Kode</th><th>Tipe</th><th>Customer</th><th>Jenis</th>
    <th>Total</th><th>Status</th><th></th></tr></thead><tbody>`;
  dataPekerjaan.forEach(p => {
    html += `<tr>
      <td><b>${p.kode || "-"}</b></td>
      <td><span class="badge ${p.tipe === "instansi" ? "badge-blue" : "badge-orange"}">${p.tipe}</span></td>
      <td>${p.namaCustomer || "-"}</td>
      <td>${p.jenisPekerjaan || "-"}</td>
      <td><b>${rupiah(p.totalHarga)}</b></td>
      <td><span class="badge ${p.status === "lunas" ? "badge-green" : "badge-red"}">${p.status}</span></td>
      <td><button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="hapusData('pekerjaan','${p.id}')">Hapus</button></td>
    </tr>`;
  });
  html += "</tbody></table>";
  el.innerHTML = html;
}

function renderPemasukan() {
  const el = document.getElementById("listPemasukan");
  if (dataPemasukan.length === 0) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">💰</div>
      Belum ada pemasukan.
    </div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>Tanggal</th><th>Pekerjaan</th><th>Nominal</th>
    <th>Metode</th><th>Keterangan</th><th></th></tr></thead><tbody>`;
  dataPemasukan.forEach(m => {
    const pj = dataPekerjaan.find(x => x.id === m.pekerjaanId);
    html += `<tr>
      <td>${m.tanggal || "-"}</td>
      <td>${pj ? pj.kode : "-"}</td>
      <td class="money-in">+${rupiah(m.nominal)}</td>
      <td><span class="badge badge-green">${m.metode || "-"}</span></td>
      <td>${m.keterangan || "-"}</td>
      <td><button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="hapusData('pemasukan','${m.id}')">Hapus</button></td>
    </tr>`;
  });
  html += "</tbody></table>";
  el.innerHTML = html;
}

function renderPengeluaran() {
  const el = document.getElementById("listPengeluaran");
  if (dataPengeluaran.length === 0) {
    el.innerHTML = `<div class="empty">
      <div class="empty-icon">💸</div>
      Belum ada pengeluaran.
    </div>`;
    return;
  }
  let html = `<table><thead><tr>
    <th>Tanggal</th><th>Kategori</th><th>Nominal</th>
    <th>Keterangan</th><th></th></tr></thead><tbody>`;
  dataPengeluaran.forEach(k => {
    html += `<tr>
      <td>${k.tanggal || "-"}</td>
      <td><span class="badge badge-orange">${k.kategori || "-"}</span></td>
      <td class="money-out">-${rupiah(k.nominal)}</td>
      <td>${k.keterangan || "-"}</td>
      <td><button class="btn btn-danger" style="padding:5px 10px;font-size:12px;" onclick="hapusData('pengeluaran','${k.id}')">Hapus</button></td>
    </tr>`;
  });
  html += "</tbody></table>";
  el.innerHTML = html;
}

function isiDropdownPekerjaan() {
  const sel = document.getElementById("mPekerjaan");
  sel.innerHTML = '<option value="">-- Pilih --</option>' +
    dataPekerjaan.map(p => `<option value="${p.id}">${p.kode} - ${p.namaCustomer}</option>`).join("");
}

// ====================== TAB SWITCH ======================
window.switchTab = (tab, el) => {
  document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
  el.classList.add("active");
  ["pekerjaan", "pemasukan", "pengeluaran"].forEach(t => {
    document.getElementById("tab-" + t).classList.toggle("hidden", t !== tab);
  });
};

// ====================== MODAL ======================
window.openTambah = () => {
  document.getElementById("pTgl").value = new Date().toISOString().split("T")[0];
  document.getElementById("modalPekerjaan").classList.add("show");
};
window.openTambahMasuk = () => {
  document.getElementById("mTanggal").value = new Date().toISOString().split("T")[0];
  document.getElementById("modalMasuk").classList.add("show");
};
window.openTambahKeluar = () => {
  document.getElementById("kTanggal").value = new Date().toISOString().split("T")[0];
  document.getElementById("modalKeluar").classList.add("show");
};
window.closeModal = (id) => document.getElementById(id).classList.remove("show");

// Close modal on backdrop click
document.querySelectorAll(".modal").forEach(m => {
  m.addEventListener("click", (e) => {
    if (e.target === m) m.classList.remove("show");
  });
});

// ====================== SIMPAN ======================
window.simpanPekerjaan = async () => {
  const nama = document.getElementById("pNama").value.trim();
  const total = Number(document.getElementById("pTotal").value);
  if (!nama || !total) { toast("Nama dan total wajib diisi!", "error"); return; }

  const kode = "PJ-" + Date.now().toString().slice(-8);
  await addDoc(collection(db, "pekerjaan"), {
    kode,
    tipe: document.getElementById("pTipe").value,
    namaCustomer: nama,
    noHp: document.getElementById("pHp").value,
    jenisPekerjaan: document.getElementById("pJenis").value,
    totalHarga: total,
    jumlahTermin: Number(document.getElementById("pTermin").value),
    tanggalMulai: document.getElementById("pTgl").value,
    status: "dikerjakan",
    createdAt: serverTimestamp(),
  });

  closeModal("modalPekerjaan");
  ["pNama","pHp","pTotal"].forEach(id => document.getElementById(id).value = "");
  await loadAll();
  toast("Pekerjaan berhasil disimpan!");
};

window.simpanMasuk = async () => {
  const pid = document.getElementById("mPekerjaan").value;
  const nominal = Number(document.getElementById("mNominal").value);
  if (!pid || !nominal) { toast("Pekerjaan dan nominal wajib diisi!", "error"); return; }

  await addDoc(collection(db, "pemasukan"), {
    pekerjaanId: pid,
    tanggal: document.getElementById("mTanggal").value,
    nominal,
    metode: document.getElementById("mMetode").value,
    keterangan: document.getElementById("mKet").value,
    createdAt: serverTimestamp(),
  });

  closeModal("modalMasuk");
  ["mNominal","mKet"].forEach(id => document.getElementById(id).value = "");
  await loadAll();
  toast("Pemasukan berhasil disimpan!");
};

window.simpanKeluar = async () => {
  const nominal = Number(document.getElementById("kNominal").value);
  if (!nominal) { toast("Nominal wajib diisi!", "error"); return; }

  await addDoc(collection(db, "pengeluaran"), {
    kategori: document.getElementById("kKategori").value,
    tanggal: document.getElementById("kTanggal").value,
    nominal,
    keterangan: document.getElementById("kKet").value,
    createdAt: serverTimestamp(),
  });

  closeModal("modalKeluar");
  ["kNominal","kKet"].forEach(id => document.getElementById(id).value = "");
  await loadAll();
  toast("Pengeluaran berhasil disimpan!");
};

window.hapusData = async (coll, id) => {
  if (!confirm("Yakin hapus data ini?")) return;
  await deleteDoc(doc(db, coll, id));
  await loadAll();
  toast("Data dihapus");
};

// ====================== START ======================
loadAll();
</script>
