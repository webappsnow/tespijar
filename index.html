<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Jasa AC & Listrik</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-24 md:pb-0">

  <!-- APP CONTAINER -->
  <div id="app" class="min-h-screen flex flex-col md:flex-row">
    
    <!-- DESKTOP SIDEBAR -->
    <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-white min-h-screen p-4 sticky top-0 h-screen shadow-lg">
      <div class="text-xl font-bold mb-8 flex items-center gap-2 text-blue-400">
        <i class="fa-solid fa-bolt"></i>
        <span>Jasa AC & Listrik</span>
      </div>
      <nav class="space-y-2 flex-1">
        <button onclick="switchTab('input')" id="nav-input" class="nav-btn w-full text-left px-4 py-3 rounded-lg bg-blue-600 text-white flex items-center gap-3 font-medium transition-colors">
          <i class="fa-solid fa-plus-circle w-5"></i> Input Order
        </button>
        <button onclick="switchTab('orders')" id="nav-orders" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-slate-800 text-slate-300 flex items-center gap-3 transition-colors">
          <i class="fa-solid fa-list-check w-5"></i> Daftar Order
        </button>
        <button onclick="switchTab('reports')" id="nav-reports" class="nav-btn w-full text-left px-4 py-3 rounded-lg hover:bg-slate-800 text-slate-300 flex items-center gap-3 transition-colors">
          <i class="fa-solid fa-chart-line w-5"></i> Laporan
        </button>
      </nav>
      <div class="text-xs text-slate-500 pt-4 border-t border-slate-800">
        v1.0 Owner Dashboard
      </div>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 p-4 md:p-8 max-w-4xl mx-auto w-full">
      
      <!-- MOBILE HEADER -->
      <header class="md:hidden flex justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
        <h1 class="font-bold text-base text-slate-800 flex items-center gap-2">
          <i class="fa-solid fa-bolt text-blue-600"></i> Servis AC & Listrik
        </h1>
        <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2.5 py-1 rounded-full">Owner</span>
      </header>

      <!-- TAB 1: FORM INPUT ORDER -->
      <section id="tab-input" class="tab-content">
        <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-lg font-bold mb-4 flex items-center gap-2 text-slate-800">
            <i class="fa-solid fa-pen-to-square text-blue-600"></i> Input Order Baru
          </h2>
          
          <form id="orderForm" onsubmit="saveOrder(event)" class="space-y-4">
            <!-- Baris 1: Tanggal & Teknisi -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal Instalasi / Pengerjaan</label>
                <input type="date" id="installationDate" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Teknisi</label>
                <select id="technician" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                  <option value="" disabled selected>-- Pilih Teknisi --</option>
                  <option value="JHON">JHON</option>
                  <option value="MADUN">MADUN</option>
                  <option value="RONI">RONI</option>
                </select>
              </div>
            </div>

            <!-- Nama Customer -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Nama Customer</label>
              <input type="text" id="customerName" required placeholder="Contoh: Bpk. Budi" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            </div>

            <!-- Alamat -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Alamat / Lokasi</label>
              <textarea id="address" rows="2" required placeholder="Contoh: Jl. Mawar No. 10, Blok A" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm"></textarea>
            </div>

            <!-- Jenis Pekerjaan -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jenis Pekerjaan</label>
              <select id="serviceType" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                <option value="" disabled selected>-- Pilih Jenis Pekerjaan --</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Instalasi AC">Instalasi AC</option>
                <option value="Instalasi Listrik">Instalasi Listrik</option>
                <option value="Instalasi Water Heater">Instalasi Water Heater</option>
              </select>
            </div>

            <!-- Asal Orderan & Jumlah Pekerjaan -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Asal Orderan</label>
                <select id="channel" required class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm bg-white">
                  <option value="WhatsApp">WhatsApp</option>
                  <option value="Instagram">Instagram</option>
                  <option value="Google Maps">Google Maps</option>
                  <option value="Telepon Langsung">Telepon Langsung</option>
                  <option value="Langganan / Tetangga">Langganan / Tetangga</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jumlah Pekerjaan (Unit/Titik)</label>
                <input type="number" id="quantity" min="1" value="1" required placeholder="Contoh: 2" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
              </div>
            </div>

            <!-- Harga Jasa -->
            <div>
              <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Harga Jasa (Total Rp)</label>
              <input type="number" id="fee" required placeholder="Contoh: 150000" class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:outline-none text-sm">
            </div>

            <!-- Tombol Simpan -->
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-lg transition-colors flex items-center justify-center gap-2 text-sm shadow-md cursor-pointer">
              <i class="fa-solid fa-floppy-disk"></i> Simpan Orderan
            </button>
          </form>
        </div>
      </section>

      <!-- TAB 2: DAFTAR ORDER -->
      <section id="tab-orders" class="tab-content hidden">
        <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
          <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-slate-800">Daftar Orderan Masuk</h2>
            <span id="orderCount" class="text-xs bg-slate-100 px-3 py-1 rounded-full font-semibold text-slate-600">0 Order</span>
          </div>
          
          <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
              <thead>
                <tr class="bg-slate-50 border-b border-slate-200 text-xs text-slate-500 uppercase">
                  <th class="p-3">Tanggal / Teknisi</th>
                  <th class="p-3">Customer & Alamat</th>
                  <th class="p-3">Pekerjaan</th>
                  <th class="p-3 text-right">Biaya Jasa</th>
                  <th class="p-3 text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="orderTableBody" class="divide-y divide-slate-100 text-sm">
                <!-- Data akan dimasukkan otomatis lewat JavaScript -->
                <tr>
                  <td colspan="5" class="p-4 text-center text-slate-400">Memuat data...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </section>

      <!-- TAB 3: LAPORAN -->
      <section id="tab-reports" class="tab-content hidden">
        <div class="space-y-6">
          
          <!-- Card Ringkasan Bulan Ini -->
          <div class="bg-gradient-to-r from-blue-600 to-indigo-700 p-6 rounded-2xl text-white shadow-md">
            <h2 class="text-sm font-medium text-blue-100 uppercase tracking-wider mb-1">Total Omzet Jasa Bulan Ini</h2>
            <div id="monthlyTotalRevenue" class="text-3xl font-extrabold mb-4">Rp 0</div>
            <div class="flex gap-4 border-t border-blue-500/40 pt-4 text-xs">
              <div>Total Orderan: <span id="monthlyTotalOrders" class="font-bold">0</span></div>
            </div>
          </div>

          <!-- Rekap Per Teknisi -->
          <div class="bg-white p-5 md:p-6 rounded-2xl shadow-sm border border-slate-200">
            <h3 class="text-md font-bold text-slate-800 mb-4 flex items-center gap-2">
              <i class="fa-solid fa-users text-blue-600"></i> Rekap Jasa Per Teknisi (Bulan Ini)
            </h3>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="technicianReportContainer">
              <!-- Diisi otomatis -->
            </div>
          </div>

        </div>
      </section>

    </main>

    <!-- MOBILE BOTTOM NAVIGATION -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2.5 flex justify-around items-center z-50 shadow-lg">
      <button onclick="switchTab('input')" id="m-nav-input" class="flex flex-col items-center gap-1 text-blue-600">
        <i class="fa-solid fa-plus-circle text-lg"></i>
        <span class="text-[10px] font-semibold">Input</span>
      </button>
      <button onclick="switchTab('orders')" id="m-nav-orders" class="flex flex-col items-center gap-1 text-slate-400">
        <i class="fa-solid fa-list-check text-lg"></i>
        <span class="text-[10px] font-semibold">Orderan</span>
      </button>
      <button onclick="switchTab('reports')" id="m-nav-reports" class="flex flex-col items-center gap-1 text-slate-400">
        <i class="fa-solid fa-chart-line text-lg"></i>
        <span class="text-[10px] font-semibold">Laporan</span>
      </button>
    </nav>

  </div>

  <!-- JAVASCRIPT & FIREBASE LOGIC -->
  <script type="module">
    // Import Firebase SDK (Menggunakan CDN Modular)
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // ==========================================
    // KONFIGURASI FIREBASE ANDA
    // ==========================================
    // (Jika Anda punya project uji coba Firebase sendiri, ganti baris di bawah ini. 
    //  Untuk sekarang kita gunakan inisialisasi standar).
    const firebaseConfig = {
      apiKey: "AIzaSyTestKeyForSimulationOnly-12345",
      authDomain: "jasa-ac-listrik-default.firebaseapp.com",
      projectId: "jasa-ac-listrik-default",
      storageBucket: "jasa-ac-listrik-default.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdef123456"
    };

    // Inisialisasi Firebase
    // Catatan: Jika Anda belum membuat project Firebase sungguhan, 
    // kita sediakan LocalStorage fallback agar aplikasi langsung bisa diuji offline di browser Anda!
    let db = null;
    let useLocalStorage = true; // Set true agar langsung bisa diuji tanpa konfigurasi Firebase ribet dulu

    try {
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      useLocalStorage = false;
    } catch (e) {
      console.log("Menggunakan LocalStorage untuk pengujian lokal.");
    }

    // Tanggal Hari Ini di Form
    document.addEventListener("DOMContentLoaded", () => {
      const today = new Date().toISOString().split('T')[0];
      const dateInput = document.getElementById('installationDate');
      if(dateInput) dateInput.value = today;
      
      loadOrders();
    });

    // Global variable daftar order
    window.ordersList = [];

    // Fungsi Simpan Order
    window.saveOrder = async function(event) {
      event.preventDefault();
      
      const installationDate = document.getElementById('installationDate').value;
      const technician = document.getElementById('technician').value;
      const customerName = document.getElementById('customerName').value;
      const address = document.getElementById('address').value;
      const serviceType = document.getElementById('serviceType').value;
      const channel = document.getElementById('channel').value;
      const quantity = document.getElementById('quantity').value;
      const fee = document.getElementById('fee').value;

      const orderData = {
        installationDate,
        technician,
        customerName,
        address,
        serviceType,
        channel,
        quantity: Number(quantity),
        fee: Number(fee),
        month: installationDate.substring(0, 7), // Format YYYY-MM
        createdAt: Date.now()
      };

      try {
        if (!useLocalStorage && db) {
          await addDoc(collection(db, "orders"), orderData);
        } else {
          // Fallback LocalStorage untuk uji coba instan
          let localData = JSON.parse(localStorage.getItem('local_orders') || '[]');
          orderData.id = 'loc_' + Date.now();
          localData.push(orderData);
          localStorage.setItem('local_orders', JSON.stringify(localData));
        }

        alert("Sukses! Orderan atas nama " + customerName + " berhasil disimpan.");
        document.getElementById('orderForm').reset();
        document.getElementById('installationDate').value = new Date().toISOString().split('T')[0];
        document.getElementById('quantity').value = '1';
        
        loadOrders();
        switchTab('orders'); // Pindah otomatis ke daftar order
      } catch (error) {
        console.error("Gagal menyimpan:", error);
        alert("Terjadi kesalahan saat menyimpan data.");
      }
    }

    // Fungsi Muat Data Order
    window.loadOrders = function() {
      if (!useLocalStorage && db) {
        // Ambil dari Firebase
        const q = query(collection(db, "orders"), orderBy("installationDate", "desc"));
        onSnapshot(q, (snapshot) => {
          window.ordersList = [];
          snapshot.forEach((docSnap) => {
            window.ordersList.push({ id: docSnap.id, ...docSnap.data() });
          });
          renderOrdersAndReports();
        });
      } else {
        // Ambil dari LocalStorage
        const localData = JSON.parse(localStorage.getItem('local_orders') || '[]');
        window.ordersList = localData.sort((a, b) => b.installationDate.localeCompare(a.installationDate));
        renderOrdersAndReports();
      }
    }

    // Fungsi Hapus Order
    window.deleteOrder = async function(id) {
      if (confirm("Yakin ingin menghapus data orderan ini?")) {
        if (!useLocalStorage && db) {
          await deleteDoc(doc(db, "orders", id));
        } else {
          let localData = JSON.parse(localStorage.getItem('local_orders') || '[]');
          localData = localData.filter(item => item.id !== id);
          localStorage.setItem('local_orders', JSON.stringify(localData));
          loadOrders();
        }
      }
    }

    // Render Tabel & Laporan
    function renderOrdersAndReports() {
      const tbody = document.getElementById('orderTableBody');
      const countBadge = document.getElementById('orderCount');
      tbody.innerHTML = '';
      
      countBadge.innerText = window.ordersList.length + ' Order';

      if (window.ordersList.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400">Belum ada orderan masuk.</td></tr>`;
        renderReports([]);
        return;
      }

      window.ordersList.forEach(order => {
        const tr = document.createElement('tr');
        tr.className = "hover:bg-slate-50 transition-colors";
        tr.innerHTML = `
          <td class="p-3">
            <div class="font-semibold text-slate-800">${order.installationDate}</div>
            <div class="text-xs text-blue-600 font-medium"><i class="fa-solid fa-user-gear"></i> ${order.technician}</div>
          </td>
          <td class="p-3">
            <div class="font-bold text-slate-800">${order.customerName}</div>
            <div class="text-xs text-slate-500 truncate max-w-xs">${order.address}</div>
            <div class="text-[10px] text-slate-400 mt-0.5">Asal: ${order.channel}</div>
          </td>
          <td class="p-3">
            <div class="font-medium text-slate-700">${order.serviceType}</div>
            <div class="text-xs text-slate-400">Qty: ${order.quantity} Unit</div>
          </td>
          <td class="p-3 text-right font-bold text-slate-800">
            Rp ${order.fee.toLocaleString('id-ID')}
          </td>
          <td class="p-3 text-center">
            <button onclick="deleteOrder('${order.id}')" class="text-red-500 hover:text-red-700 p-2 transition-colors cursor-pointer" title="Hapus">
              <i class="fa-solid fa-trash-can"></i>
            </button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      renderReports(window.ordersList);
    }

    // Render Menu Laporan Keuangan
    function renderReports(data) {
      const currentMonthStr = new Date().toISOString().substring(0, 7); // YYYY-MM
      
      // Filter bulan ini
      const monthlyData = data.filter(item => item.month === currentMonthStr);
      
      const totalRevenue = monthlyData.reduce((sum, item) => sum + Number(item.fee), 0);
      document.getElementById('monthlyTotalRevenue').innerText = 'Rp ' + totalRevenue.toLocaleString('id-ID');
      document.getElementById('monthlyTotalOrders').innerText = monthlyData.length;

      // Rekap per teknisi bulan ini
      const techStats = {
        'JHON': { count: 0, revenue: 0 },
        'MADUN': { count: 0, revenue: 0 },
        'RONI': { count: 0, revenue: 0 }
      };

      monthlyData.forEach(item => {
        if (techStats[item.technician]) {
          techStats[item.technician].count += 1;
          techStats[item.technician].revenue += Number(item.fee);
        }
      });

      const techContainer = document.getElementById('technicianReportContainer');
      techContainer.innerHTML = '';

      Object.keys(techStats).forEach(techName => {
        const stat = techStats[techName];
        const card = document.createElement('div');
        card.className = "bg-slate-50 p-4 rounded-xl border border-slate-200";
        card.innerHTML = `
          <div class="flex justify-between items-center mb-2">
            <span class="font-bold text-slate-800 text-base"><i class="fa-solid fa-user-shield text-blue-600"></i> ${techName}</span>
            <span class="text-xs bg-blue-100 text-blue-700 font-semibold px-2 py-0.5 rounded-full">${stat.count} Job</span>
          </div>
          <div class="text-xs text-slate-500 mb-1">Total Jasa Bulan Ini:</div>
          <div class="text-lg font-bold text-slate-900">Rp ${stat.revenue.toLocaleString('id-ID')}</div>
        `;
        techContainer.appendChild(card);
      });
    }

  </script>

  <!-- SCRIPT SWITCH TAB UTAMA -->
  <script>
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById('tab-' + tabName).classList.remove('hidden');

      // Update Desktop Nav
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.remove('bg-blue-600', 'text-white');
        btn.classList.add('hover:bg-slate-800', 'text-slate-300');
      });
      const activeNav = document.getElementById('nav-' + tabName);
      if(activeNav) {
        activeNav.classList.remove('hover:bg-slate-800', 'text-slate-300');
        activeNav.classList.add('bg-blue-600', 'text-white');
      }

      // Update Mobile Nav
      ['input', 'orders', 'reports'].forEach(t => {
        const mBtn = document.getElementById('m-nav-' + t);
        if(mBtn) {
          mBtn.classList.remove('text-blue-600');
          mBtn.classList.add('text-slate-400');
        }
      });
      const activeMBtn = document.getElementById('m-nav-' + tabName);
      if(activeMBtn) {
        activeMBtn.classList.remove('text-slate-400');
        activeMBtn.classList.add('text-blue-600');
      }
    }
  </script>

</body>
</html>
